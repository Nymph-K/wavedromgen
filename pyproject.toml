[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavedromgen"
version = "2.1.0"
description = "Interactive, WaveDrom-compatible digital timing diagram editor (Qt)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "WaveDromGen contributors" },
]
keywords = ["wavedrom", "timing-diagram", "waveform", "qt", "eda"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "PySide6>=6.6,<7",
  "json5>=0.9.14",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["ruff>=0.6"]

[project.gui-scripts]
wavedromgen = "WaveDromGen.app:run"

[project.urls]
Homepage = "https://github.com/Nymph-K/wavedromgen"
Upstream = "https://github.com/blueyesess/wavedromgen"
Source = "https://github.com/Nymph-K/wavedromgen"

[tool.setuptools]
packages = ["WaveDromGen"]
include-package-data = true

[tool.setuptools.package-data]
WaveDromGen = ["resources/*.json", "resources/*.ico", "resources/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
